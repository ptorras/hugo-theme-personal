<header class="site-header">
  <div class="site-brand">
    {{ partial "brand-mark.html" . }}
    <div>
      <a class="site-title" href="{{ "/" | relLangURL }}">{{ .Site.Title }}</a>
      {{ with .Site.Params.subtitle }}<p class="site-subtitle">{{ . }}</p>{{ end }}
    </div>
    <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
    </button>
  </div>
  {{ with .Site.Menus.main }}
  <nav class="site-nav">
    <ul>
      {{ range . }}
      <li><a href="{{ .URL | relLangURL }}">{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </nav>
  {{ end }}
</header>
